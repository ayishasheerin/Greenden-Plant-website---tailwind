</head>
<body>
    <body>
    <nav class="bg-green-100 p-3 flex items-centre justify-between shadow-xl sticky top-0 z-10">

        <div class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5}
                stroke="currentColor" class="w-6 h-6 md:hidden ">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
            <ul class="flex gap-5 text-gray-600 hidden md:flex">
                <li>
                    <a class="hover:underline hover:text-black" href="file:///Users/ayishasheerin/Desktop/FSWD/Greenden/index.html">Home</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="/Users/ayishasheerin/Desktop/FSWD/Greenden/product.html">Products</a>
                </li>
                <li>
                    <a class="hover:underline hover:text-black" href="/Users/ayishasheerin/Desktop/FSWD/Greenden/contact.html">Contacts</a>
                </li>
            </ul>
        </div>

    </nav>
    <section class="bg-green-100 dark:bg-neutral-900 mb-5">
   <div class="grid lg:grid-cols-3 justify-center items-center gap-y-8">
      <div class="lg:col-span-2 p-6 w-full max-w-2xl mx-auto lg:p-8">
         <div class="mb-12">
            <h2 class="text-3xl font-bold text-slate-900 mb-6 md:text-4xl dark:text-slate-50">
               Contact us
            </h2>
            <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400">
               Have a question, need support, or want to discuss your next project? We’re here to help.
            </p>
         </div>

         <form class="grid gap-4 sm:grid-cols-2">
            <div>
               <label for="name"
                  class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Name</label>
               <input type="text" id="name" name="name" placeholder="John doe"
                  class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-green-100 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
            </div>
            <div>
               <label for="email"
                  class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Email</label>
               <input type="email" id="email" name="email" placeholder="john@readymadeui.com"
                  class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-green-100 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
            </div>
            <div>
               <label for="phone" class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Phone
                  number</label>
               <input type="number" id="phone" name="phone" placeholder="+11800-259-854"
                  class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-green-100 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
            </div>
            <div>
               <label for="company"
                  class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Company</label>
               <input type="text" id="company" name="company" placeholder="XYZ pvt. ltd."
                  class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-green-100 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700" />
            </div>
            <div class="col-span-full">
               <div>
                  <label for="message"
                     class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Message</label>
                  <textarea placeholder="Write message" rows="6" type="text" id="message" name="message"
                     class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-green-100 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700"></textarea>
               </div>
               <button type="submit"
                  class="mt-6 w-full py-2.5 px-4 text-sm rounded-md font-semibold cursor-pointer text-slate-900 border bg-green-200 hover:bg-green-400 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-green-50">Send
                  message</button>
            </div>
         </form>
      </div>

      <div class="relative -order-1 lg:order-1 lg:h-screen">
         <img src="./images/plant.webp" alt="contact us image"
            class="w-full h-full object-cover object-top lg:absolute lg:right-0 lg:top-0 lg:bottom-0" />
      </div>
   </div>
</section>
    <section class="bg-green-100 p-10 flex flex-col gap-5">
        <h1 class="text-4xl font-bold">Greenden</h1>
        <p>Bringing fresh, beautiful, and healthy plants to brighten every corner of your home.</p>
        <p>@ 2026 Greenday.com</p>

    </section>
</body>
</html>
